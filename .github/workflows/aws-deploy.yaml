name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deployment on EC2
        run: |
          ssh -i ~/.ssh/ec2.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            echo "Connected to EC2"

            hostname
            whoami

            cd /home/ubuntu/deployment

            git pull

            echo "Hello World, I am running in AWS VM"

            # kubectl apply -f k8s/05-java-deployment.yaml -n java-demo

            # kubectl get pods -n java-demo

          EOF
